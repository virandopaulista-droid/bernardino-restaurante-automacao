name: Gera cronograma semanal

on:
  schedule:
    - cron: "0 21 * * 0"  # Sunday 21:00 UTC = 18:00 America/Sao_Paulo
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  TZ: America/Sao_Paulo
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fuse3
          pip install --quiet Pillow pillow-heif

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone and mount Google Drive
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          mkdir -p "$HOME/gdrive"
          rclone mount gdrive: "$HOME/gdrive" \
            --daemon --vfs-cache-mode=minimal --dir-cache-time=1h \
            --log-file="$HOME/rclone-mount.log" --log-level=INFO
          # Accented folder names (Agência, Vídeos) can be a different Unicode
          # normalization form on Drive than a literal string typed here, so
          # match with single-char globs (?) instead of the exact accented
          # character -- this matches on bytes actually present on disk.
          ready=""
          for i in $(seq 1 15); do
            if [ -d "$HOME"/gdrive/Ag?ncia\ BEEF\ MTK/Clientes/Bernadino\ restaurante ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "=== rclone mount log ==="
            cat "$HOME/rclone-mount.log" || true
            echo "=== root listing (repr) ==="
            ls "$HOME/gdrive/" | cat -A | head -30
            echo "mount failed"
            exit 1
          fi
          restaurante_dir=$(echo "$HOME"/gdrive/Ag?ncia\ BEEF\ MTK/Clientes/Bernadino\ restaurante)
          echo "RESTAURANTE_DIR=$restaurante_dir" >> "$GITHUB_ENV"

      - name: Write .env
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=$OPENAI_API_KEY
          FB_PAGE_ACCESS_TOKEN=$FB_PAGE_ACCESS_TOKEN
          FB_PAGE_ID=$FB_PAGE_ID
          IG_BUSINESS_ID=$IG_BUSINESS_ID
          MEDIA_DIR_IMAGES_2025=$RESTAURANTE_DIR/Imagens tratadas/2025
          MEDIA_DIR_IMAGES_2026=$RESTAURANTE_DIR/Imagens tratadas/2026
          MEDIA_DIR_VIDEOS=$(echo "$RESTAURANTE_DIR"/V?deos\ Tratados)
          MEDIA_DIR_STORIES_REELS=$(echo "$RESTAURANTE_DIR"/V?deos\ Tratados/Stories\ Reels)
          BRENDA_STORIES_DIR=$(echo "$RESTAURANTE_DIR"/STORIES/Brenda\ -\ Stories)
          EOF
          export OPENAI_API_KEY FB_PAGE_ACCESS_TOKEN FB_PAGE_ID IG_BUSINESS_ID
          export MEDIA_DIR_IMAGES_2025 MEDIA_DIR_IMAGES_2026 MEDIA_DIR_VIDEOS MEDIA_DIR_STORIES_REELS BRENDA_STORIES_DIR

      - name: Generate week plan + gallery
        id: generate
        run: |
          set -a; source .env; set +a
          plan_path=$(python3 scripts/generate_week_plan.py)
          echo "plan_path=$plan_path" >> "$GITHUB_OUTPUT"
          gallery_path=$(python3 scripts/build_week_gallery.py "$plan_path")
          echo "gallery_path=$gallery_path" >> "$GITHUB_OUTPUT"

      - name: Commit plan + gallery
        run: |
          git config user.name "Bernardino Automacao"
          git config user.email "virandopaulista@gmail.com"
          git add content/week_plans/ content/*.json
          git diff --cached --quiet || git commit -m "Cronograma da semana gerado automaticamente"
          git push

      - name: Abrir issue avisando que o cronograma esta pronto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Cronograma pronto para aprovação: ${{ steps.generate.outputs.plan_path }}" \
            --body "O cronograma da próxima semana foi gerado automaticamente e está aguardando aprovação. Peça pro Claude revisar e publicar a galeria: \`${{ steps.generate.outputs.gallery_path }}\` (arquivo commitado no repositório)."
