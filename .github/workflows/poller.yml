name: Poller (feed/stories/reels)

on:
  schedule:
    # Every 15 min, 10-22 UTC (07:00-19:00 America/Sao_Paulo, no DST), Mon-Fri.
    # Wide + frequent on purpose: GitHub's cron does not reliably fire at the
    # configured time (confirmed 2026-07-29, a run landed hours off target
    # and matched nothing) -- poller.py now does catch-up matching (fires on
    # whatever tick actually lands after a scheduled time, same day), so a
    # wide window matters more here than an exact one.
    - cron: "*/15 10-22 * * 1-5"
  workflow_dispatch:
    inputs:
      live:
        description: "Postar de verdade? (false = so testar o mount/ambiente, sem publicar)"
        type: boolean
        default: false
      force_date:
        description: "(opcional, so p/ teste manual) forca postar esta data (YYYY-MM-DD) ignorando a janela de horario"
        type: string
        default: ""
      force_slot:
        description: "(opcional, usar com force_date) feed | story | reel"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

# With two independent triggers now (GitHub's own schedule + the Claude
# routine backup calling workflow_dispatch), two runs could otherwise
# execute in parallel, both read "posted: false" before either saves state,
# and both post for real -- a duplicate post. Serialize instead of
# cancelling so a legitimate due run still happens, just queued.
#
# That alone isn't enough: if a run posts for real and then fails to git
# push its "posted" flag (5 retries exhausted), the NEXT run -- 15 min
# later -- still sees "posted: false" and would post again for real. The
# "Commit any state changes" step below now opens a GitHub Issue when that
# happens, and the "Trava de seguranca" step (right after checkout) refuses
# to run at all while that issue is open, so a human has to confirm the
# real state before posting resumes.
concurrency:
  group: bernardino-poller
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trava de seguranca -- aborta se uma execucao anterior nao salvou o estado
        run: |
          open_alert=$(gh issue list --search "risco de post duplicado in:title" --state open --json number --jq 'length')
          if [ "$open_alert" != "0" ]; then
            echo "##[error] Existe uma issue aberta avisando que uma execucao anterior nao conseguiu salvar o estado (posted/used flags) apos publicar de verdade. Recusando rodar ate isso ser resolvido e a issue fechada manualmente -- ver issues abertas abaixo."
            gh issue list --search "risco de post duplicado in:title" --state open
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fuse3
          pip install --quiet Pillow pillow-heif

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone and mount Google Drive
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          echo "rclone.conf: $(wc -c < ~/.config/rclone/rclone.conf) bytes"
          echo "=== remotes configurados ==="
          rclone listremotes || echo "(rclone listremotes falhou, exit $?)"
          echo "=== teste direto de conexao (rclone about gdrive:) ==="
          rclone about gdrive: || echo "(rclone about falhou, exit $?)"
          mkdir -p "$HOME/gdrive"
          if ! rclone mount gdrive: "$HOME/gdrive" \
            --daemon --vfs-cache-mode=minimal --dir-cache-time=1h \
            --timeout=60s --contimeout=60s --low-level-retries=15 \
            --log-file="$HOME/rclone-mount.log" --log-level=INFO; then
            echo "##[error] comando 'rclone mount' retornou erro na hora (nao entrou em background)"
            echo "=== rclone mount log ==="
            cat "$HOME/rclone-mount.log" 2>/dev/null || echo "(sem log)"
            exit 1
          fi
          sleep 3
          # Resolve the exact relative path via ONE recursive rclone listing
          # (avoids re-querying Drive by a re-assembled accented path, which
          # proved unreliable -- listing once and grepping the full known
          # relative pattern in a single pass is more robust).
          rclone lsf gdrive: -R --dirs-only > "$HOME/all_dirs.txt"
          rel_path=$(grep -i "^Ag.ncia BEEF MTK/Clientes */Bernadino restaurante */$" "$HOME/all_dirs.txt" | head -1)
          if [ -z "$rel_path" ]; then
            echo "=== nao encontrado, mostrando entradas parecidas ==="
            grep -i "bernadino\|agencia\|ag.ncia" "$HOME/all_dirs.txt" | head -20
            echo "mount failed: caminho do restaurante nao encontrado"
            exit 1
          fi
          restaurante_dir="$HOME/gdrive/${rel_path}"
          ready=""
          for i in $(seq 1 15); do
            if [ -d "$restaurante_dir" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "=== rclone mount log ==="
            cat "$HOME/rclone-mount.log" || true
            echo "mount failed: $restaurante_dir nao apareceu no mount"
            exit 1
          fi
          restaurante_dir="${restaurante_dir%/}"
          echo "RESTAURANTE_DIR=$restaurante_dir" >> "$GITHUB_ENV"

      - name: Write .env
        run: |
          videos_name=$(ls "$RESTAURANTE_DIR" | grep -i "^V.deos Tratados$" | head -1)
          videos_dir="$RESTAURANTE_DIR/$videos_name"
          brenda_name=$(ls "$RESTAURANTE_DIR/STORIES" | grep -i "^Brenda - Stories" | head -1)
          brenda_dir="$RESTAURANTE_DIR/STORIES/$brenda_name"
          cat > .env <<EOF
          OPENAI_API_KEY="$OPENAI_API_KEY"
          FB_PAGE_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN"
          FB_PAGE_ID="$FB_PAGE_ID"
          IG_BUSINESS_ID="$IG_BUSINESS_ID"
          MEDIA_DIR_IMAGES_2025="$RESTAURANTE_DIR/Imagens tratadas/2025"
          MEDIA_DIR_IMAGES_2026="$RESTAURANTE_DIR/Imagens tratadas/2026"
          MEDIA_DIR_VIDEOS="$videos_dir"
          MEDIA_DIR_STORIES_REELS="$videos_dir/Stories Reels"
          BRENDA_STORIES_DIR="$brenda_dir"
          EOF
          cat .env | sed 's/^\(OPENAI\|FB_PAGE_ACCESS_TOKEN\)=.*/\1=***/'

      - name: Run poller
        run: |
          extra_args=()
          if [ -n "${{ inputs.force_date }}" ] && [ -n "${{ inputs.force_slot }}" ]; then
            extra_args+=(--force-date "${{ inputs.force_date }}" --force-slot "${{ inputs.force_slot }}")
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            bash scripts/run_poller.sh --live "${extra_args[@]}"
          else
            bash scripts/run_poller.sh "${extra_args[@]}"
          fi

      - name: Commit any state changes (used flags, posted flags)
        if: always()
        run: |
          git config user.name "Bernardino Automacao"
          git config user.email "virandopaulista@gmail.com"
          git add content/*.json content/week_plans/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nada para commitar"
            exit 0
          fi
          git commit -m "poller: atualiza estado (posted/used)"
          # CRITICAL: if a post just succeeded above, its "posted" flag MUST
          # land here -- if this push silently fails (e.g. a concurrent run
          # updated the remote first), the next tick would think the post
          # never happened and post it again for real. Retry with rebase
          # instead of failing once and moving on.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push ok (tentativa $attempt)"
              exit 0
            fi
            echo "push falhou, tentativa $attempt/5 -- rebase e tenta de novo"
            git fetch origin master
            git rebase origin/master || { git rebase --abort; git reset --soft origin/master; git stash pop 2>/dev/null || true; }
            sleep $((attempt * 3))
          done
          echo "##[error] NAO CONSEGUI SALVAR O ESTADO APOS 5 TENTATIVAS -- risco real de post duplicado na proxima execucao"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'O poller publicou (ou tentou publicar) e depois falhou 5x seguidas ao dar git push do estado atualizado (posted/used flags) em content/. Enquanto esta issue estiver aberta, o poller vai se recusar a rodar de novo (trava de seguranca no inicio do job).\n\nLog da execucao que falhou: %s\n\nO que fazer:\n1. Confira no log acima o que foi (ou nao foi) publicado de verdade no Facebook/Instagram.\n2. Resolva manualmente o conflito de git em content/*.json e content/week_plans/*.json (git pull + resolver + push).\n3. Confira se o campo "posted" do post correspondente esta correto no JSON antes de fechar esta issue.\n4. Feche esta issue so depois de confirmar que o estado no repositorio bate com o que foi realmente postado.' "$run_url")
          gh issue create --title "URGENTE: risco de post duplicado -- estado do poller nao foi salvo" --body "$body" || echo "##[error] tambem falhei ao criar a issue de alerta -- verifique manualmente e com urgencia"
          exit 1
