name: Poller (feed/stories/reels)

on:
  schedule:
    # UTC times -- covers Mon-Fri 07:45-10:15 America/Sao_Paulo (UTC-3, no DST in Brazil)
    - cron: "*/5 10-13 * * 1-5"
  workflow_dispatch:
    inputs:
      live:
        description: "Postar de verdade? (false = so testar o mount/ambiente, sem publicar)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fuse3
          pip install --quiet Pillow pillow-heif

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone and mount Google Drive
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          mkdir -p "$HOME/gdrive"
          rclone mount gdrive: "$HOME/gdrive" \
            --daemon --vfs-cache-mode=minimal --dir-cache-time=1h \
            --log-file="$HOME/rclone-mount.log" --log-level=INFO
          # Resolve exact folder names via rclone's own API listing instead of
          # bash filesystem globs -- accented names (Agência, Vídeos) proved
          # unreliable to glob-match under the runner's default locale even
          # with LC_ALL=C.UTF-8 set, so ask rclone itself what the top-level
          # folder is actually called (byte-for-byte, no shell involved).
          agencia_name=$(rclone lsf gdrive: --dirs-only | grep -i "^Ag.ncia BEEF MTK/$" | head -1)
          if [ -z "$agencia_name" ]; then
            echo "=== rclone lsf root ==="
            rclone lsf gdrive: --dirs-only
            echo "mount failed: pasta Agencia BEEF MTK nao encontrada"
            exit 1
          fi
          restaurante_name=$(rclone lsf "gdrive:${agencia_name}Clientes" --dirs-only | grep -i "^Bernadino restaurante/$" | head -1)
          restaurante_dir="$HOME/gdrive/${agencia_name}Clientes/${restaurante_name}"
          ready=""
          for i in $(seq 1 15); do
            if [ -d "$restaurante_dir" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "=== rclone mount log ==="
            cat "$HOME/rclone-mount.log" || true
            echo "mount failed: $restaurante_dir nao apareceu no mount"
            exit 1
          fi
          restaurante_dir="${restaurante_dir%/}"
          echo "RESTAURANTE_DIR=$restaurante_dir" >> "$GITHUB_ENV"

      - name: Write .env
        run: |
          videos_name=$(ls "$RESTAURANTE_DIR" | grep -i "^V.deos Tratados$" | head -1)
          videos_dir="$RESTAURANTE_DIR/$videos_name"
          cat > .env <<EOF
          OPENAI_API_KEY=$OPENAI_API_KEY
          FB_PAGE_ACCESS_TOKEN=$FB_PAGE_ACCESS_TOKEN
          FB_PAGE_ID=$FB_PAGE_ID
          IG_BUSINESS_ID=$IG_BUSINESS_ID
          MEDIA_DIR_IMAGES_2025=$RESTAURANTE_DIR/Imagens tratadas/2025
          MEDIA_DIR_IMAGES_2026=$RESTAURANTE_DIR/Imagens tratadas/2026
          MEDIA_DIR_VIDEOS=$videos_dir
          MEDIA_DIR_STORIES_REELS=$videos_dir/Stories Reels
          BRENDA_STORIES_DIR=$RESTAURANTE_DIR/STORIES/Brenda - Stories
          EOF
          cat .env | sed 's/^\(OPENAI\|FB_PAGE_ACCESS_TOKEN\)=.*/\1=***/'

      - name: Run poller
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            bash scripts/run_poller.sh --live
          else
            bash scripts/run_poller.sh
          fi

      - name: Commit any state changes (used flags, posted flags)
        run: |
          git config user.name "Bernardino Automacao"
          git config user.email "virandopaulista@gmail.com"
          git add content/*.json content/week_plans/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "poller: atualiza estado (posted/used)"
          git push
