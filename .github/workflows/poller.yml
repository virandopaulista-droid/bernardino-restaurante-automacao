name: Poller (feed/stories/reels)

on:
  schedule:
    # UTC times -- covers Mon-Fri 07:45-10:15 America/Sao_Paulo (UTC-3, no DST in Brazil)
    - cron: "*/5 10-13 * * 1-5"
  workflow_dispatch:
    inputs:
      live:
        description: "Postar de verdade? (false = so testar o mount/ambiente, sem publicar)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fuse3
          pip install --quiet Pillow pillow-heif

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone and mount Google Drive
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          mkdir -p "$HOME/gdrive"
          rclone mount gdrive: "$HOME/gdrive" --daemon --vfs-cache-mode=minimal --dir-cache-time=1h
          sleep 5
          ls "$HOME/gdrive/Agência BEEF MTK/Clientes/Bernadino restaurante" || (echo "mount failed" && exit 1)

      - name: Write .env
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=$OPENAI_API_KEY
          FB_PAGE_ACCESS_TOKEN=$FB_PAGE_ACCESS_TOKEN
          FB_PAGE_ID=$FB_PAGE_ID
          IG_BUSINESS_ID=$IG_BUSINESS_ID
          MEDIA_DIR_IMAGES_2025=$HOME/gdrive/Agência BEEF MTK/Clientes/Bernadino restaurante/Imagens tratadas/2025
          MEDIA_DIR_IMAGES_2026=$HOME/gdrive/Agência BEEF MTK/Clientes/Bernadino restaurante/Imagens tratadas/2026
          MEDIA_DIR_VIDEOS=$HOME/gdrive/Agência BEEF MTK/Clientes/Bernadino restaurante/Vídeos Tratados
          MEDIA_DIR_STORIES_REELS=$HOME/gdrive/Agência BEEF MTK/Clientes/Bernadino restaurante/Vídeos Tratados/Stories Reels
          BRENDA_STORIES_DIR=$HOME/gdrive/Agência BEEF MTK/Clientes/Bernadino restaurante/STORIES/Brenda - Stories
          EOF

      - name: Run poller
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            bash scripts/run_poller.sh --live
          else
            bash scripts/run_poller.sh
          fi

      - name: Commit any state changes (used flags, posted flags)
        run: |
          git config user.name "Bernardino Automacao"
          git config user.email "virandopaulista@gmail.com"
          git add content/*.json content/week_plans/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "poller: atualiza estado (posted/used)"
          git push
